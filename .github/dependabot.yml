version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-server-dom-webpack']
      build-toolchain:
        patterns: ['vinext', 'vite', '@vitejs/*', '@cloudflare/*', 'wrangler']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
